<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATTR-CM SPECT/CT Imaging</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 30px;
            background: white;
        }

        h1 {
            font-size: 26px;
        }

        .images {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            flex-wrap: wrap;
        }

        .scan {
            width: 45%;
            min-width: 280px;
        }

        .scan img {
            width: 100%;
            height: auto;
        }

        .scan h2 {
            font-size: 20px;
        }
    </style>
</head>

<body>

<h1>99mTc-DPD SPECT/CT Imaging in ATTR-CM</h1>

<div class="images">

    <div class="scan">
        <h2>Control mice</h2>
        <img src="control mice.gif" alt="Control mice">
    </div>

    <div class="scan">
        <h2>ATTR amyloid mice</h2>
        <img src="ATTR amyloid mice.gif" alt="ATTR amyloid mice">
    </div>

</div>

</body>
</html>
